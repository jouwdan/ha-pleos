name: Validate and publish geocoder client

on:
  push:
    branches: ["**"]
    tags: ["nominatim-reverse-client-v*"]
    paths:
      - packages/nominatim-reverse-client/**
      - .github/workflows/publish-geocoder.yml
  pull_request:
    paths:
      - packages/nominatim-reverse-client/**
      - .github/workflows/publish-geocoder.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: packages/nominatim-reverse-client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - name: Verify package release version
        if: startsWith(github.ref, 'refs/tags/nominatim-reverse-client-v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"nominatim-reverse-client-v{version}", "Release tag must match package version"
          PY
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m coverage run -m unittest discover -s tests -v
      - run: python -m coverage report
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test the built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m unittest discover -s tests -v
          python - <<'PY'
          from pathlib import Path
          import nominatim_reverse_client
          installed = Path(nominatim_reverse_client.__file__)
          assert "site-packages" in installed.parts, installed
          assert installed.with_name("py.typed").exists()
          PY
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.14'
        with:
          name: nominatim-reverse-client-distributions
          path: packages/nominatim-reverse-client/dist/*
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/nominatim-reverse-client-v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-nominatim-reverse-client
      url: https://pypi.org/p/nominatim-reverse-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nominatim-reverse-client-distributions
          path: dist/
      - name: Publish distributions with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
